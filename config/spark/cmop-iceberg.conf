# CMOP 自己的 Spark Iceberg catalog。写入路径准入检查 A1、A2、A4 适用于本文件。
# catalog 必须是 REST，理由见 docs/dev/design/2026-09-12-write-path-admission-checks.md。
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.cmop org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.cmop.type rest
spark.sql.catalog.cmop.uri http://cmop-iceberg-rest:8181
