name: admission-check

on:
  push:
    paths: ["config/**", "tools/admission-check/**", ".github/workflows/admission-check.yml"]
  pull_request:
    paths: ["config/**", "tools/admission-check/**", ".github/workflows/admission-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/admission-check/check.py
      - run: python -m pytest -q tools/admission-check/tests
